name: Atualizar leis a partir do Planalto

on:
  schedule:
    # Toda segunda-feira, 06h17 no horário de Belém (09h17 UTC).
    - cron: '17 9 * * 1'
  workflow_dispatch:
    inputs:
      lei:
        description: 'Identificador da lei no catálogo (vazio = todas)'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'leis/*/analises/**'
      - 'leis/catalogo.json'
      - 'scripts/**'

permissions:
  contents: write

concurrency:
  group: atualizar-leis
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run testar

      - name: Baixar o texto oficial e gerar os Markdown
        if: github.event_name != 'push'
        # O Planalto costuma recusar conexões de servidores em nuvem. Quando isso
        # acontece, o fluxo registra um aviso e segue regenerando a partir dos
        # dados já salvos, em vez de falhar toda semana.
        run: |
          ALVO=""
          if [ -n "${{ github.event.inputs.lei }}" ]; then ALVO="--lei ${{ github.event.inputs.lei }}"; fi
          if ! node scripts/atualizar.mjs $ALVO; then
            echo "::warning title=Planalto indisponível::O Planalto recusou a conexão do GitHub Actions. Rode 'npm run atualizar' em um computador pessoal para atualizar o texto oficial."
            node scripts/atualizar.mjs --somente-gerar $ALVO
          fi

      - name: Regenerar os Markdown a partir das análises (sem baixar)
        if: github.event_name == 'push'
        run: node scripts/atualizar.mjs --somente-gerar

      - name: Publicar alterações
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nada mudou."
          else
            git commit -m "Atualiza leis a partir do Planalto ($(date -u +%F))"
            git push
          fi
