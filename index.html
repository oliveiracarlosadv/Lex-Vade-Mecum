<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lex Vade Mecum</title>
<meta name="author" content="Carlos Alexandre Albuquerque Oliveira">
<meta name="description" content="Lex Vade Mecum — consulta on-line de leis brasileiras com o texto oficial atualizado e a análise de cada artigo.">
<link rel="icon" href="assets/lex-vade-mecum-icone.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --mesa:#E9E3D3;        /* fundo, como a mesa sob o livro */
  --papel:#FBF8F0;       /* folha */
  --papel2:#F4EFE2;      /* faixas e notas */
  --tinta:#2A2925;       /* texto */
  --tinta2:#5E5A50;      /* texto secundário */
  --titulo:#384A2C;      /* verde-oliva da marca, sóbrio */
  --titulo2:#46712A;
  --fio:#D9D0BA;         /* fios e bordas */
  --marca-texto:#F3E3A4;
  --aviso:#F6EBCB; --avisoBorda:#B8962E; --tachado:#8C877A;
  --sombra:0 1px 1px rgba(60,50,30,.06),0 8px 28px rgba(60,50,30,.10);
  --serif:"Literata",Georgia,"Iowan Old Style","Times New Roman",serif;
  --display:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
  --ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --corpo:clamp(16.5px, .35vw + 15px, 19px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --mesa:#14120E; --papel:#1E1B16; --papel2:#25211A; --tinta:#E6DFCD; --tinta2:#ABA390;
    --titulo:#B9CDA4; --titulo2:#9FC07F; --fio:#3A3428; --marca-texto:#5E5121;
    --aviso:#2C2716; --avisoBorda:#9C7F26; --tachado:#7E7869; --sombra:0 8px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --mesa:#14120E; --papel:#1E1B16; --papel2:#25211A; --tinta:#E6DFCD; --tinta2:#ABA390;
  --titulo:#B9CDA4; --titulo2:#9FC07F; --fio:#3A3428; --marca-texto:#5E5121;
  --aviso:#2C2716; --avisoBorda:#9C7F26; --tachado:#7E7869; --sombra:0 8px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;max-width:100%;overflow-x:hidden}
@supports (overflow-x:clip){html,body{overflow-x:clip}}
/* Nada sai da largura da tela: palavras e links longos quebram linha. */
.folha,.md,.oficial,.campos,.alt,.loc,.res,.dica,.rodape,.indice,.cartao,.popover,.painel{overflow-wrap:anywhere;word-break:break-word;min-width:0}
a{overflow-wrap:anywhere}
body{background:var(--mesa);color:var(--tinta);font-family:var(--serif);font-size:var(--corpo);line-height:1.7;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
a{color:var(--titulo2);text-underline-offset:2px}
button,input,select{font:inherit;color:inherit}

/* ---------- Barra superior ---------- */
.topo{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--papel);border-bottom:1px solid var(--fio);position:sticky;top:0;z-index:20}
.marca{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--titulo);flex:none}
.marca img{width:42px;height:42px}
.marca .nome{font-family:var(--display);line-height:1}
.marca .nome b{display:block;font-size:26px;font-weight:700;letter-spacing:.12em}
.marca .nome .por{display:block;font-family:var(--serif);font-style:italic;font-size:11.5px;letter-spacing:.02em;color:var(--tinta2);margin-top:3px;white-space:nowrap}
.marca .nome i{display:block;font-style:normal;font-size:15px;letter-spacing:.18em;font-variant:small-caps;color:var(--titulo2);margin-top:2px}
.busca{flex:1;display:flex;gap:8px;align-items:center;max-width:720px;margin-left:auto}
.busca input[type=search]{flex:1;min-width:0;padding:10px 14px;border:1px solid var(--fio);border-radius:999px;background:var(--papel2);font-family:var(--ui);font-size:15px}
.busca input[type=search]:focus{outline:2px solid var(--titulo2);outline-offset:1px}
.busca select{padding:9px 10px;border:1px solid var(--fio);border-radius:999px;background:var(--papel2);font-family:var(--ui);font-size:14px}
.btn{padding:8px 14px;border:1px solid var(--fio);border-radius:999px;background:var(--papel);cursor:pointer;font-family:var(--ui);font-size:14px;white-space:nowrap;text-decoration:none;color:var(--tinta)}
.btn:hover{border-color:var(--titulo2)}
.btn.prim{background:var(--titulo);color:var(--papel);border-color:var(--titulo)}
.menu-btn{display:none}

/* ---------- Estrutura ---------- */
.corpo{flex:1;display:flex;min-height:0;min-width:0;max-width:100vw}
aside{width:290px;flex:none;background:var(--papel2);border-right:1px solid var(--fio);overflow:auto;padding:18px 12px 40px}
aside h2{font-family:var(--display);font-variant:small-caps;letter-spacing:.12em;font-size:17px;font-weight:600;color:var(--titulo);margin:6px 10px 8px;border-bottom:1px solid var(--fio);padding-bottom:4px}
.lei{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 10px;border-radius:6px;cursor:pointer;line-height:1.3;font-family:var(--serif);font-size:15px;color:var(--tinta)}
.lei:hover{background:var(--papel)}
.lei.ativa{background:var(--papel);box-shadow:inset 3px 0 0 var(--titulo);color:var(--titulo);font-weight:600}
.lei small{display:block;font-family:var(--ui);font-weight:400;color:var(--tinta2);font-size:12px;margin-top:2px}
.menu-extra{margin-top:12px;border-top:1px solid var(--fio);padding-top:8px}
.sumario{margin:2px 0 14px 4px}
.sumario a{display:block;text-decoration:none;color:var(--tinta);padding:4px 8px;border-radius:5px;font-size:13.5px;line-height:1.3}
.sumario a:hover{background:var(--papel)}
.sumario a.n2{padding-left:18px;color:var(--tinta2)}
.sumario a.n3{padding-left:28px;color:var(--tinta2);font-size:12.5px}
.sumario .grupo{font-family:var(--display);font-variant:small-caps;letter-spacing:.1em;color:var(--titulo);margin:12px 8px 2px;font-size:15px}
main{flex:1;min-width:0;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth;padding:28px 18px 80px}

/* ---------- A folha (página de livro) ---------- */
.folha{max-width:44rem;margin:0 auto;background:var(--papel);box-shadow:var(--sombra);border:1px solid var(--fio);border-radius:3px;padding:clamp(26px, 5vw, 64px) clamp(20px, 6vw, 72px) 56px;position:relative}
.cabecalho-corrido{font-family:var(--display);font-variant:small-caps;letter-spacing:.14em;font-size:14px;color:var(--tinta2);text-align:center;border-bottom:1px solid var(--fio);padding-bottom:8px;margin-bottom:28px}
.texto{text-align:justify;hyphens:auto;-webkit-hyphens:auto}
.texto p{margin:0 0 .55em}
h1.titulo-obra{font-family:var(--display);font-weight:600;font-size:clamp(28px, 3.6vw, 40px);line-height:1.15;text-align:center;color:var(--titulo);margin:.2em 0 .3em;letter-spacing:.01em}
.subtitulo{text-align:center;font-style:italic;color:var(--tinta2);margin:0 0 .4em}
.vinheta{text-align:center;color:var(--titulo2);letter-spacing:.6em;margin:18px 0;font-size:14px}
.meta-lei{text-align:center;font-family:var(--ui);font-size:13px;color:var(--tinta2);display:flex;flex-wrap:wrap;gap:4px 16px;justify-content:center}
.ferr{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:16px 0 4px}
.secao{margin:2.4em 0}
.secao>h2,.parte>h2{font-family:var(--display);font-weight:600;font-variant:small-caps;letter-spacing:.08em;font-size:clamp(22px, 2.2vw, 27px);color:var(--titulo);text-align:center;margin:0 0 .8em}
.secao>h2::after,.parte>h2::after{content:"";display:block;width:56px;height:1px;background:var(--titulo2);margin:.35em auto 0}
.md{text-align:justify;hyphens:auto;-webkit-hyphens:auto}
.md p{margin:0 0 .6em}
.md ul{padding-left:1.3em;margin:.3em 0 .8em}
.md li{margin:.15em 0}
.md table{border-collapse:collapse;width:100%;font-family:var(--ui);font-size:13.5px;line-height:1.45;margin:12px 0 18px;display:block;overflow-x:auto;text-align:left;hyphens:manual}
.md th,.md td{border-bottom:1px solid var(--fio);padding:7px 8px;vertical-align:top}
.md th{border-bottom:2px solid var(--titulo);font-weight:600;color:var(--titulo)}
.md blockquote{margin:10px 0;padding:8px 14px;border-left:3px solid var(--avisoBorda);background:var(--aviso);font-family:var(--ui);font-size:14px;text-align:left}
.md h3{font-family:var(--display);font-size:21px;color:var(--titulo);margin:1em 0 .3em}
.md h4{font-family:var(--display);font-variant:small-caps;letter-spacing:.08em;font-size:17px;font-weight:600;color:var(--titulo2);margin:1em 0 .2em}
del{color:var(--tachado);text-decoration-thickness:1px}
mark{background:var(--marca-texto);color:inherit;padding:0 1px;border-radius:2px}
mark.foco{outline:2px solid var(--titulo2);outline-offset:1px;animation:pisca 1.2s ease-out 2}
@keyframes pisca{50%{outline-color:transparent}}

/* ---------- Dispositivos (artigos e temas) ---------- */
.dispositivo{margin:2.2em 0 1.4em;scroll-margin-top:20px}
.dispositivo.alvo .rotulo{background:var(--marca-texto)}
.disp-cab{text-align:center;margin-bottom:.6em}
.rotulo{display:inline-block;font-family:var(--display);font-weight:700;font-size:clamp(20px, 1.8vw, 23px);letter-spacing:.06em;color:var(--titulo);padding:0 6px;border-radius:3px}
.rotulo-tit{display:block;font-family:var(--display);font-style:italic;font-weight:500;font-size:clamp(18px, 1.6vw, 21px);color:var(--tinta);margin-top:2px}
.loc{font-family:var(--ui);font-size:12px;letter-spacing:.02em;color:var(--tinta2);text-align:center;margin:.2em 0 .9em}
.acoes{display:flex;justify-content:center;gap:4px;flex-wrap:wrap;margin:-.4em 0 1em}
.acao{display:inline-flex;align-items:center;gap:5px;border:1px solid transparent;background:none;color:var(--tinta2);cursor:pointer;font-family:var(--ui);font-size:12.5px;padding:4px 10px;border-radius:999px;line-height:1}
.acao:hover,.acao:focus-visible{border-color:var(--fio);background:var(--papel2);color:var(--titulo)}
.acao svg{width:15px;height:15px;flex:none}
.popover{position:fixed;z-index:60;background:var(--papel);border:1px solid var(--fio);border-radius:10px;box-shadow:var(--sombra);padding:6px;min-width:210px;font-family:var(--ui);font-size:14px}
.popover[hidden]{display:none}
.popover .tit{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--tinta2);padding:6px 10px 4px}
.popover button,.popover a{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 10px;border-radius:6px;cursor:pointer;text-align:left;color:var(--tinta);text-decoration:none;font-size:14px}
.popover button:hover,.popover a:hover{background:var(--papel2)}
.popover svg{width:17px;height:17px;color:var(--titulo2);flex:none}
.barra-selecao{position:fixed;z-index:55;display:flex;gap:2px;background:var(--titulo);color:var(--papel);border-radius:999px;padding:4px;box-shadow:var(--sombra);font-family:var(--ui)}
.barra-selecao[hidden]{display:none}
.barra-selecao button{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:inherit;cursor:pointer;font-size:13px;padding:7px 12px;border-radius:999px}
.barra-selecao button:hover{background:rgba(255,255,255,.14)}
.barra-selecao svg{width:15px;height:15px}
.aviso-rapido{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:70;background:var(--tinta);color:var(--papel);font-family:var(--ui);font-size:14px;padding:10px 18px;border-radius:999px;box-shadow:var(--sombra);opacity:0;transition:opacity .2s;pointer-events:none}
.aviso-rapido.on{opacity:1}
#areaImpressao,#fabricaImagem{display:none}
#fabricaImagem.ativa{display:block;position:fixed;left:-20000px;top:0}
.story-img{width:1080px;height:1920px;overflow:hidden;background:#FBF8F0;color:#2A2925;display:flex;flex-direction:column;box-sizing:border-box;padding:150px 120px 140px;font-family:var(--serif);position:relative}
.st-moldura{position:absolute;left:44px;top:44px;right:44px;bottom:44px;border:2px solid #D9D0BA;border-radius:8px}
.st-topo{text-align:center;padding-bottom:56px;border-bottom:2px solid #384A2C;position:relative}
.st-topo img{width:600px;height:auto}
.st-meio{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;position:relative}
.st-caixa{margin:auto 0;padding:24px 0 36px}
.st-aspas{font-family:var(--display);font-size:220px;line-height:1;height:130px;color:#46712A;margin-left:-8px}
.st-texto{line-height:1.5;hyphens:none}
.ln{display:block;text-align:justify;text-align-last:justify;white-space:nowrap}
.ln.ult{text-align-last:left}
.st-rodape{border-top:2px solid #384A2C;padding-top:48px;text-align:center;position:relative}
.st-disp{font-family:var(--display);font-weight:700;font-size:54px;color:#384A2C;line-height:1.15}
.st-lei{font-family:var(--display);font-size:42px;line-height:1.2;margin-top:10px}
.st-num{font-family:var(--serif);font-size:32px;color:#5E5A50;margin-top:12px}
.st-site{font-family:var(--serif);font-size:28px;color:#5E5A50;margin-top:30px}
.card-img{width:1080px;background:#FBF8F0;color:#2A2925;font-family:var(--serif);padding:80px 88px 64px;box-sizing:border-box}
.card-img .ci-topo{display:flex;align-items:center;gap:16px;border-bottom:2px solid #384A2C;padding-bottom:20px;margin-bottom:36px}
.card-img .ci-topo img{width:64px;height:64px}
.card-img .ci-marca{font-family:var(--display);color:#384A2C;line-height:1}
.card-img .ci-marca b{display:block;font-size:40px;letter-spacing:.14em}
.card-img .ci-marca i{display:block;font-style:normal;font-variant:small-caps;letter-spacing:.2em;font-size:22px;color:#46712A}
.card-img .ci-lei{margin-left:auto;text-align:right;font-family:var(--serif);font-size:20px;color:#5E5A50;max-width:520px;line-height:1.35}
.card-img .ci-rot{font-family:var(--display);font-weight:700;font-size:46px;color:#384A2C;text-align:center;letter-spacing:.04em}
.card-img .ci-sub{font-family:var(--display);font-style:italic;font-size:32px;text-align:center;margin-top:4px}
.card-img .ci-texto{font-size:30px;line-height:1.6;text-align:justify;margin-top:30px}
.card-img .ci-texto p{margin:0 0 .45em}
.card-img .ci-texto p.inciso,.card-img .ci-texto p.alinea{padding-left:1.2em}
.card-img .ci-texto del{color:#8C877A}
.card-img .ci-citacao{text-align:justify;font-size:36px;line-height:1.55;font-style:italic;border-left:5px solid #46712A;padding-left:28px;margin:10px 0 26px}
.card-img .ci-fonte{font-family:var(--display);font-size:28px;color:#384A2C;text-align:right}
.card-img .ci-rodape{margin-top:44px;border-top:1px solid #D9D0BA;padding-top:18px;font-family:var(--serif);font-size:19px;color:#5E5A50;display:flex;justify-content:space-between;gap:20px}
.indice{list-style:none;padding:0;margin:22px auto 0;text-align:left;max-width:36rem;counter-reset:lei}
.indice li{border-bottom:1px solid var(--fio)}
.indice a{display:block;padding:14px 4px;text-decoration:none;color:var(--tinta)}
.indice a:hover .nome-lei{color:var(--titulo2);text-decoration:underline;text-underline-offset:3px}
.indice .nome-lei{font-family:var(--display);font-weight:600;font-size:clamp(19px,1.7vw,22px);line-height:1.25;color:var(--titulo)}
.indice .num-lei{font-family:var(--serif);color:var(--tinta)}
.indice .num-lei::before{content:" — ";color:var(--tinta2)}
.indice .meta{display:block;font-family:var(--ui);font-size:12.5px;color:var(--tinta2);margin-top:3px}
.campos{font-family:var(--ui);font-size:13px;color:var(--tinta2);background:var(--papel2);border-radius:4px;padding:8px 12px;margin:0 0 .9em;line-height:1.5}
.campos b{color:var(--tinta);font-weight:600}
.oficial p{margin:0 0 .4em}
.oficial p.caput{text-indent:1.6em}
.oficial p.paragrafo{text-indent:1.6em}
.oficial p.inciso{padding-left:2.2em;text-indent:-1.2em}
.oficial p.alinea{padding-left:3.4em;text-indent:-1.2em}
.oficial p.item{padding-left:4.4em;text-indent:-1.2em}
.oficial p.nota{text-indent:0;font-style:italic;color:var(--tinta2)}
.alt{font-family:var(--ui);font-size:12.5px;color:var(--tinta2);border-top:1px solid var(--fio);padding-top:6px;margin-top:.8em;text-align:left}
details.analise{margin-top:1em;border-top:1px solid var(--fio)}
details.analise summary{cursor:pointer;font-family:var(--display);font-variant:small-caps;letter-spacing:.08em;font-size:16px;color:var(--titulo2);padding:6px 0;list-style:none}
details.analise summary::before{content:"❧  "}
details.analise .md{font-size:.9em;line-height:1.6;color:var(--tinta)}
.oculta-analises details.analise{display:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0 36px}
.chip{font-family:var(--display);font-variant:small-caps;letter-spacing:.06em;font-size:16px;line-height:1.1;padding:7px 15px;border:1px solid var(--fio);border-radius:999px;background:var(--papel2);color:var(--titulo);cursor:pointer}
.chip:hover,.chip:focus-visible{border-color:var(--titulo2);background:var(--papel)}
.chip.ativo{background:var(--titulo);color:var(--papel);border-color:var(--titulo)}
.painel{border:0;padding:0;background:transparent;width:min(46rem,94vw);max-width:none;max-height:92vh;color:var(--tinta)}
.painel::backdrop{background:rgba(30,25,15,.5)}
.painel .painel-folha{max-height:92vh;overflow:auto;margin:0;max-width:none;padding:clamp(20px,4vw,52px)}
.painel-fechar{position:sticky;top:0;float:right;z-index:2;margin:-6px -6px 0 12px;font-size:13px}
.painel .secao{margin-top:.6em}
.sep{text-align:center;color:var(--fio);letter-spacing:1em;margin:1.6em 0 0;font-size:12px}

/* ---------- Início, busca e Sobre ---------- */
.capa{text-align:center}
.capa img{width:min(420px, 80%);height:auto;margin:6px auto 10px;display:block}
.capa .titulo-indice{font-family:var(--display);font-weight:600;font-variant:small-caps;letter-spacing:.1em;font-size:24px;color:var(--titulo);margin:26px 0 0}
.capa .assinatura{font-family:var(--display);font-size:clamp(19px,1.8vw,23px);letter-spacing:.04em;color:var(--titulo);margin:0 0 14px}
.capa .assinatura a{color:inherit;font-style:italic;text-decoration:none;border-bottom:1px solid var(--fio)}
.capa .lema{font-style:italic;color:var(--tinta2);max-width:32em;margin:0 auto}
.cartoes{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:22px;text-align:left}
.cartao{background:var(--papel2);border:1px solid var(--fio);border-radius:4px;padding:14px 16px;cursor:pointer;text-align:left;font-family:var(--serif)}
.cartao:hover{border-color:var(--titulo2)}
.cartao h3{margin:0 0 6px;font-family:var(--display);font-size:20px;line-height:1.15;color:var(--titulo)}
.cartao p{margin:0;font-family:var(--ui);font-size:12.5px;color:var(--tinta2)}
.dica{font-family:var(--ui);font-size:14px;line-height:1.55;color:var(--tinta2);background:var(--papel2);border:1px solid var(--fio);border-radius:4px;padding:12px 16px;margin-top:22px;text-align:left}
.dica code{background:var(--papel);padding:1px 6px;border-radius:4px;border:1px solid var(--fio)}
.res{display:block;text-decoration:none;color:inherit;border-bottom:1px solid var(--fio);padding:12px 2px}
.res:hover .t{text-decoration:underline}
.res .t{font-family:var(--display);font-weight:700;font-size:19px;color:var(--titulo)}
.res .l{font-family:var(--ui);font-size:12px;color:var(--tinta2)}
.res .s{margin-top:4px;font-size:.95em;text-align:justify}
.sobre-autor{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start}
.sobre-autor .inicial{font-family:var(--display);font-size:64px;line-height:1;color:var(--titulo);border:1px solid var(--fio);border-radius:50%;width:96px;height:96px;display:grid;place-items:center;background:var(--papel2)}
.capitular::first-letter{font-family:var(--display);float:left;font-size:3.4em;line-height:.85;padding:.06em .08em 0 0;color:var(--titulo);font-weight:600}
.carregando{font-family:var(--ui);color:var(--tinta2);text-align:center;padding:40px 0}
.rodape{font-family:var(--ui);font-size:12px;line-height:1.5;color:var(--tinta2);border-top:1px solid var(--fio);margin-top:44px;padding-top:12px;text-align:center}
.topo-btn{position:fixed;right:18px;bottom:18px;z-index:15;box-shadow:var(--sombra)}

@media (max-width:900px){
  .menu-btn{display:inline-block}
  aside{position:fixed;top:63px;bottom:0;left:0;z-index:30;transform:translateX(-105%);transition:transform .2s;box-shadow:0 0 30px rgba(0,0,0,.25)}
  body.menu-aberto aside{transform:none}
  .busca select{display:none}
}
@media (max-width:600px){
  .topo{gap:8px;padding:8px 10px}
  .marca .nome{display:none}
  .busca input[type=search]{font-size:16px}
  .marca img{width:36px;height:36px}
  .busca .btn.prim{display:none}
  main{padding:10px 0 70px}
  .folha{border-left:0;border-right:0;border-radius:0}
  .oficial p.inciso{padding-left:1.6em}
  .oficial p.alinea{padding-left:2.4em}
  .sobre-autor{grid-template-columns:1fr}
  .painel{width:100vw;height:100%;max-height:100%;margin:0}
  .painel .painel-folha{max-height:100%;height:100%;border-radius:0}
  .chip{font-size:14.5px;padding:6px 12px}
  .barra-selecao button{padding:7px 9px;font-size:12.5px;gap:4px}
}
@media print{
  :root,:root[data-theme="dark"]{--papel:#fff;--papel2:#f5f5f5;--tinta:#111;--tinta2:#444;--titulo:#2b3a22;--titulo2:#3c5f24;--fio:#ccc;--marca-texto:transparent}
  html,body{height:auto;display:block;background:#fff;font-size:11.5pt}
  aside,.topo,.topo-btn,.ferr,.acoes,.popover,.barra-selecao,.aviso-rapido{display:none!important}
  .corpo{display:block} main{overflow:visible;padding:0}
  .folha{box-shadow:none;border:0;max-width:none;padding:0}
  .dispositivo{break-inside:avoid-page} h2,h3,.disp-cab{break-after:avoid}
  body.imprimindo>*:not(#areaImpressao){display:none!important}
  body.imprimindo #areaImpressao{display:block}
  #areaImpressao .rodape{margin-top:24px}
  @page{margin:18mm 16mm}
}

<!-- Só existe na cópia para abrir sem internet/servidor (ferramentas/gerar-offline.py). -->

<script>
'use strict';
/* =========================================================================
   Lex Vade Mecum — página de consulta.
   Lê as leis diretamente de leis/<lei>/<lei>-completa.md (os mesmos arquivos
   atualizados pela conferência semanal com o Planalto e o TST) e a lista de
   leis da tabela "Acesso direto às leis" do README. Aberta como arquivo local,
   usa dados-offline.js, se existir.
   ========================================================================= */
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const semAcento = (s) => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const SITE = 'https://oliveiracarlosadv.github.io/Lex-Vade-Mecum/';

/* ---------- Markdown mínimo ---------- */
function inline(t) {
  t = esc(t.replace(/&lt;/g, '<'));
  t = t.replace(/\\([\\.()#>|*+\-_~`[\]])/g, '$1');
  t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
  t = t.replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  t = t.replace(/~~([^~]+)~~/g, '<del>$1</del>');
  t = t.replace(/\[([^\]]+)\]\((https?:[^)\s]+|[^)\s]+\.md)\)/g, (m, a, u) =>
    /^https?:/.test(u) ? `<a href="${u}" target="_blank" rel="noopener">${a}</a>` : `<a href="${linkInterno(u)}">${a}</a>`);
  t = t.replace(/(^|[\s(])(https?:\/\/[^\s<)|]+)/g, (m, a, u) => `${a}<a href="${u}" target="_blank" rel="noopener" title="${u}">${encurtarUrl(u)}</a>`);
  return t;
}
// Mostra endereços longos de forma curta (domínio/…/arquivo), para não estourar a largura da tela.
function encurtarUrl(u) {
  const sem = u.replace(/^https?:\/\//, '');
  if (sem.length <= 42) return sem;
  const partes = sem.split('/');
  return partes.length > 2 ? partes[0] + '/…/' + partes[partes.length - 1] : sem.slice(0, 40) + '…';
}
function linkInterno(u) { const id = (u.match(/leis\/([^/]+)\//) || [])[1]; return id ? `#/${id}` : u; }
function md(src) {
  const L = src.split('\n'); let h = '', i = 0;
  while (i < L.length) {
    const l = L[i];
    if (!l.trim()) { i++; continue; }
    if (/^#{1,6} /.test(l)) { const n = l.match(/^#+/)[0].length; h += `<h${n}>${inline(l.slice(n + 1))}</h${n}>`; i++; continue; }
    if (/^---+$/.test(l.trim())) { i++; continue; }
    if (l.startsWith('|')) {
      const rows = []; while (i < L.length && L[i].startsWith('|')) rows.push(L[i++]);
      const cel = (r) => r.replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
      h += '<table><thead><tr>' + cel(rows[0]).map((c) => `<th>${inline(c)}</th>`).join('') + '</tr></thead><tbody>';
      rows.slice(2).forEach((r) => (h += '<tr>' + cel(r).map((c) => `<td>${inline(c)}</td>`).join('') + '</tr>'));
      h += '</tbody></table>'; continue;
    }
    if (l.startsWith('>')) { const b = []; while (i < L.length && L[i].startsWith('>')) b.push(L[i++].replace(/^>\s?/, '')); h += `<blockquote>${inline(b.join(' '))}</blockquote>`; continue; }
    if (/^- /.test(l)) { h += '<ul>'; while (i < L.length && /^- /.test(L[i])) h += `<li>${inline(L[i++].slice(2))}</li>`; h += '</ul>'; continue; }
    const p = []; while (i < L.length && L[i].trim() && !/^(#{1,6} |\||>|- )/.test(L[i])) p.push(L[i++]);
    h += `<p>${inline(p.join(' '))}</p>`;
  }
  return h;
}

/* ---------- Dados ---------- */
const leis = [];
const cache = {};
let readmeTexto = '';
async function lerArquivo(caminho) {
  if (window.LEX_DADOS && window.LEX_DADOS[caminho] != null) return window.LEX_DADOS[caminho];
  const r = await fetch(caminho, { cache: 'no-cache' });
  if (!r.ok) throw new Error(`${caminho}: HTTP ${r.status}`);
  return r.text();
}
async function carregarCatalogo() {
  readmeTexto = await lerArquivo('README.md');
  const bloco = (readmeTexto.split('<!-- catalogo:inicio -->')[1] || '').split('<!-- catalogo:fim -->')[0];
  bloco.split('\n').filter((l) => l.startsWith('|') && /\]\(leis\//.test(l)).forEach((l) => {
    const c = l.replace(/^\||\|$/g, '').split('|').map((x) => x.trim());
    const arquivo = (c[3].match(/\((leis\/[^)]+\.md)\)/) || [])[1];
    const oficial = (c[4].match(/\((https?:[^)]+)\)/) || [])[1];
    if (!arquivo) return;
    leis.push({ id: arquivo.split('/')[1], nome: c[0], numero: c[1].replace(/^[—–-]\s*/, ''), data: c[2], arquivo, oficial, conferido: c[5] || '' });
  });
}
function parseLei(txt) {
  const [antes, resto = ''] = txt.split('\n## Texto Estruturado\n');
  const k = resto.indexOf('\n## Direitos Garantidos\n');
  const corpo = k >= 0 ? resto.slice(0, k) : resto, depois = k >= 0 ? resto.slice(k + 1) : '';
  const titulo = (antes.match(/^# (.+)$/m) || [, ''])[1];
  const secoes = (s) => s.split(/\n(?=## )/).filter((x) => x.startsWith('## ')).map((x) => {
    const nl = x.indexOf('\n'); return { titulo: x.slice(3, nl).trim(), corpo: x.slice(nl + 1) };
  });
  const unidades = ('\n' + corpo).split('\n### ').slice(1).map((b, idx) => {
    const nl = b.indexOf('\n'); const head = b.slice(0, nl).trim(); const rest = b.slice(nl + 1);
    const [ofic, analise = ''] = rest.split('\n#### Interpretação\n');
    const linhas = ofic.split('\n').filter((x) => x.trim() && x.trim() !== '---');
    const loc = (linhas.find((x) => x.startsWith('**Localização:**')) || '').replace('**Localização:** ', '');
    const alt = linhas.find((x) => x.startsWith('> **Alterações'));
    const campos = linhas.filter((x) => /^\*\*[^*]+:?\*\*/.test(x) && !x.startsWith('**Localização:**') && !x.startsWith('**Tese'));
    const texto = linhas.filter((x) => !x.startsWith('**') && !x.startsWith('> **Alterações'));
    const [rotulo, subt = ''] = head.split(/ — (?=[^—]*$)/).length > 1 && /^(Tema|IRDR|IAC) /.test(head) ? head.split(/ — (.+)/) : [head, ''];
    return { idx, head, rotulo, subt, id: slug(head.split(' — ')[0] + (head.startsWith('ADCT') ? ' ' + head.split(' — ')[1] : '')),
      loc, alt, campos, texto, analise: '#### Interpretação\n' + analise.replace(/\n---\s*$/, ''),
      busca: semAcento(texto.join(' ').replace(/[~*\\]/g, '') + ' ' + subt), buscaAn: semAcento(analise.replace(/[#*>\\-]/g, ' ')),
      chave: chaveArtigo(head) };
  });
  return { titulo, antes: secoes(antes), depois: secoes(depois), unidades };
}
function slug(s) { return semAcento(s).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }
function chaveArtigo(head) {
  const t = semAcento(head);
  if (t.startsWith('preambulo')) return 'preambulo';
  const p = t.match(/^(irdr|iac)\s*n?[º°o.]*\s*(\d+)/);
  if (p) return p[1] + '-' + p[2];
  const m = t.match(/^(adct\s*—\s*)?(?:art\.|tema)\s*([\d.]+)\s*º?(-[a-z])?/);
  if (!m) return null;
  return (m[1] ? 'adct-' : '') + m[2].replace(/\./g, '') + (m[3] || '');
}
async function abrirLei(id) {
  if (cache[id]) return cache[id];
  const lei = leis.find((l) => l.id === id); if (!lei) throw new Error('Lei não encontrada');
  cache[id] = parseLei(await lerArquivo(lei.arquivo));
  return cache[id];
}

/* ---------- Diagramação dos dispositivos ---------- */
function classeLinha(x) {
  const t = x.replace(/^\\/, '');
  if (/^(Art\.?|Nós, representantes)/.test(t)) return 'caput';
  if (/^(§|Parágrafo único)/.test(t)) return 'paragrafo';
  if (/^[IVXLC]+(-[A-Z])?\s*[-–—]/.test(t)) return 'inciso';
  if (/^[a-z]\)/.test(t)) return 'alinea';
  if (/^\d+\\?[.)]\s/.test(t) || /^\d+[ªº]\)/.test(t)) return 'item';
  if (/^\(/.test(t) || /^(Vide|Vigência)/.test(t)) return 'nota';
  return '';
}
function blocoDispositivo(id, u, termos) {
  const realce = (html) => (termos && termos.length ? realcar(html, termos) : html);
  const texto = u.texto.map((x) => `<p class="${classeLinha(x)}">${realce(inline(x))}</p>`).join('');
  const campos = u.campos.length ? `<div class="campos">${u.campos.map((x) => inline(x)).join('<br>')}</div>` : '';
  const alt = u.alt ? `<div class="alt">${inline(u.alt.replace(/^>\s*/, ''))}</div>` : '';
  return `<article class="dispositivo" id="${id}--${u.id}">
    <div class="disp-cab"><span class="rotulo">${esc(u.rotulo)}</span>${u.subt ? `<span class="rotulo-tit">${realce(esc(u.subt))}</span>` : ''}</div>
    ${u.loc ? `<div class="loc">${esc(u.loc)}</div>` : ''}
    <div class="acoes" data-uid="${u.id}">
      <button class="acao" data-acao="compartilhar" title="Enviar o texto e o link deste dispositivo">${ICONE.compartilhar}Compartilhar</button>
      <button class="acao" data-acao="imprimir" title="Imprimir só este dispositivo">${ICONE.imprimir}Imprimir</button>
      <button class="acao" data-acao="imagem" title="Gerar uma imagem deste dispositivo">${ICONE.imagem}Imagem</button>
    </div>${campos}
    <div class="oficial texto">${texto}</div>${alt}
    <details class="analise" open><summary>Análise do dispositivo</summary><div class="md">${md(u.analise)}</div></details>
  </article>`;
}
function realcar(html, termos) {
  return html.split(/(<[^>]+>)/).map((p) => {
    if (p.startsWith('<')) return p;
    const base = semAcento(p); const marcas = [];
    termos.forEach((t) => { let k = 0; while ((k = base.indexOf(t, k)) >= 0) { marcas.push([k, k + t.length]); k += t.length; } });
    if (!marcas.length) return p;
    marcas.sort((a, b) => a[0] - b[0]); let r = '', pos = 0;
    marcas.forEach(([a, b]) => { if (a < pos) return; r += p.slice(pos, a) + '<mark>' + p.slice(a, b) + '</mark>'; pos = b; });
    return r + p.slice(pos);
  }).join('');
}

/* ---------- Telas ---------- */
let atual = null;
function desenharMenu() {
  $('#listaLeis').innerHTML = leis.map((l) => `<button class="lei${atual === l.id ? ' ativa' : ''}" data-id="${l.id}">${esc(l.nome)}<small>${esc(l.numero)}</small></button>`).join('');
  document.querySelectorAll('#listaLeis .lei').forEach((b) => (b.onclick = () => { location.hash = `#/${b.dataset.id}`; fecharMenu(); }));
  $('#sobreBtn').classList.toggle('ativa', atual === 'sobre');
}
function desenharSumario(id, d) {
  if (!d) { $('#sumario').innerHTML = ''; return; }
  let h = '<h2>Sumário</h2><div class="sumario">';
  h += '<div class="grupo">Sobre a lei</div>';
  d.antes.forEach((s) => (h += `<a href="#/${id}/s-${slug(s.titulo)}" data-secao="${slug(s.titulo)}">${esc(s.titulo)}</a>`));
  h += `<div class="grupo">Texto da lei</div>`;
  const vistos = new Set(); let algum = false;
  d.unidades.forEach((u) => {
    if (!u.loc) return;
    const partes = u.loc.split(' › ');
    partes.slice(0, 3).forEach((p, n) => {
      const k = partes.slice(0, n + 1).join(' › ');
      if (vistos.has(k) || /^(Preâmbulo|Decreto-Lei)/.test(p)) return; vistos.add(k); algum = true;
      const curto = p.replace(/ — /, ' · ');
      h += `<a class="n${n + 1}" href="#/${id}/${u.id}" title="${esc(p)}">${esc(curto.length > 72 ? curto.slice(0, 70) + '…' : curto)}</a>`;
    });
  });
  if (!algum) h += `<a href="#/${id}/texto">Ir ao primeiro dispositivo</a>`;
  if (d.depois.length) h += '<div class="grupo">Análise geral</div>';
  d.depois.forEach((s) => (h += `<a href="#/${id}/s-${slug(s.titulo)}">${esc(s.titulo)}</a>`));
  $('#sumario').innerHTML = h + '</div>';
}
async function mostrarLei(id, alvo, termos) {
  atual = id; desenharMenu();
  const lei = leis.find((l) => l.id === id);
  $('#conteudo').innerHTML = '<div class="carregando">Abrindo a lei…</div>';
  let d; try { d = await abrirLei(id); } catch (e) { return erro(e); }
  desenharSumario(id, d);
  const sec = (s) => `<section class="secao" id="${id}--s-${slug(s.titulo)}"><h2>${esc(s.titulo)}</h2><div class="md">${md(s.corpo)}</div></section>`;
  let h = `<div class="cabecalho-corrido">Lex Vade Mecum · ${esc(lei.nome)}</div>
    <h1 class="titulo-obra">${esc(d.titulo || lei.nome)}</h1>
    <div class="meta-lei"><span>${esc(lei.numero)}</span><span>Publicação: ${esc(lei.data)}</span>${lei.conferido ? `<span>Conferido com a fonte oficial em ${esc(lei.conferido)}</span>` : ''}${lei.oficial ? `<a href="${lei.oficial}" target="_blank" rel="noopener">Texto oficial ↗</a>` : ''}</div>
    <div class="ferr"><button class="btn" id="tgAn">Ocultar análises</button><button class="btn" id="imprLei" title="Imprimir a lei inteira (as análises seguem a opção ao lado)">Imprimir lei</button><a class="btn" href="${lei.arquivo}" target="_blank" rel="noopener">Arquivo .md</a></div>
    <div class="vinheta">❦</div>`;
  h += `<nav class="chips" aria-label="Informações sobre a lei">${d.antes.map((s) => `<button class="chip" data-secao="${slug(s.titulo)}">${esc(s.titulo)}</button>`).join('')}</nav>`;
  h += `<section class="parte" id="${id}--texto"><h2>Texto da Lei</h2>` + d.unidades.map((u) => blocoDispositivo(id, u, termos)).join('<div class="sep">·  ·  ·</div>') + '</section>';
  h += `<div class="vinheta">❦</div>` + d.depois.map(sec).join('') + rodape();
  $('#conteudo').innerHTML = h;
  ligarLinks();
  const tg = $('#tgAn');
  const rot = () => (tg.textContent = document.body.classList.contains('oculta-analises') ? 'Mostrar análises' : 'Ocultar análises');
  tg.onclick = () => { document.body.classList.toggle('oculta-analises'); rot(); }; rot();
  $('#imprLei').onclick = () => window.print();
  irPara(id, alvo);
}
function irPara(id, alvo) {
  if (!alvo) { $('#main').scrollTop = 0; return; }
  const el = document.getElementById(`${id}--${alvo}`);
  if (!el && alvo.startsWith('s-') && abrirSecao(id, alvo.slice(2))) { $('#main').scrollTop = 0; return; }
  if (!el) { $('#main').scrollTop = 0; return; }
  document.querySelectorAll('.dispositivo.alvo').forEach((x) => x.classList.remove('alvo'));
  if (el.classList.contains('dispositivo')) el.classList.add('alvo');
  const main = $('#main');

  } finally { fab.classList.remove('ativa'); fab.innerHTML = ''; }
}
function posicionarBarraSel() {
  const bar = $('#barraSel'); const sel = getSelection();
  const ok = sel.rangeCount && !sel.isCollapsed && sel.toString().trim().length > 1 &&
    $('#conteudo').contains(sel.getRangeAt(0).commonAncestorContainer) && atual && atual !== 'sobre';
  if (!ok) { bar.hidden = true; return; }
  bar.hidden = false;
  const r = sel.getRangeAt(0).getBoundingClientRect(); const w = bar.offsetWidth;
  const toque = matchMedia('(pointer: coarse)').matches;
  if (toque) { bar.style.left = Math.max(8, (innerWidth - w) / 2) + 'px'; bar.style.top = ''; bar.style.bottom = '18px'; }
  else {
    bar.style.bottom = '';
    bar.style.left = Math.min(Math.max(8, r.left + r.width / 2 - w / 2), innerWidth - w - 8) + 'px';
    bar.style.top = (r.top > 70 ? r.top - bar.offsetHeight - 10 : r.bottom + 10) + 'px';
  }
}
function ligarAcoes() {
  document.addEventListener('click', (e) => {
    const b = e.target.closest('[data-secao]'); if (!b || !atual) return;
    e.preventDefault(); fecharMenu(); abrirSecao(atual, b.dataset.secao);
  });
  $('#painel').addEventListener('click', (e) => { if (e.target === $('#painel') || e.target.closest('.painel-fechar')) $('#painel').close(); });
  $('#conteudo').addEventListener('click', (e) => {
    const b = e.target.closest('[data-acao]'); if (!b) return;
    const uid = b.closest('.acoes').dataset.uid;
    if (b.dataset.acao === 'compartilhar') { const pac = pacoteUnidade(uid); if (pac) abrirPopover(b, pac); }
    if (b.dataset.acao === 'imprimir') imprimirUnidade(uid);
    if (b.dataset.acao === 'imagem') { const pac = pacoteUnidade(uid); if (pac) gerarImagem(pac); }
  });
  let t; document.addEventListener('selectionchange', () => { clearTimeout(t); t = setTimeout(posicionarBarraSel, 180); });
  $('#main').addEventListener('scroll', () => { if (!$('#barraSel').hidden) posicionarBarraSel(); fecharFlutuantes(); }, { passive: true });
  $('#barraSel').addEventListener('mousedown', (e) => e.preventDefault());
  $('#barraSel').addEventListener('click', async (e) => {
    const b = e.target.closest('[data-sel]'); if (!b) return;
    const pac = pacoteSelecao(); if (!pac) return;
    if (b.dataset.sel === 'compartilhar') abrirPopover(b, pac);
    if (b.dataset.sel === 'copiar') aviso((await copiar(pac.texto)) ? 'Trecho copiado com a fonte' : 'Não foi possível copiar');
    if (b.dataset.sel === 'imagem') gerarImagem(pac);
    if (b.dataset.sel === 'story') gerarImagem(pac, 'story');
  });
  document.addEventListener('mousedown', (e) => { if (!e.target.closest('#popover, [data-acao="compartilhar"], [data-sel]')) fecharFlutuantes(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { fecharFlutuantes(); $('#barraSel').hidden = true; } });
}

/* ---------- Busca ---------- */
function interpretarConsulta(q) {
  const t = semAcento(q.trim());
  const prec = t.match(/^(irdr|iac)\s*(?:n[º°o.]*)?\s*(\d+)$/);
  if (prec) return { tipo: 'artigo', so: 'prec', chave: prec[1] + '-' + prec[2] };
  const art = t.match(/^(?:(adct)\s*[-—]?\s*)?(?:art(?:igo)?s?\.?|tema)?\s*(?:(adct)\s*)?(\d[\d.]*)\s*º?\s*(-?\s*[a-z])?$/);
  if (art && (/^(art|artigo|tema|adct)/.test(t) || /^\d/.test(t))) {
    const adct = art[1] || art[2];
    return { tipo: 'artigo', so: /^tema/.test(t) ? 'tema' : /^art/.test(t) ? 'art' : '', chave: (adct ? 'adct-' : '') + art[3].replace(/\./g, '') + (art[4] ? '-' + art[4].replace(/[-\s]/g, '') : '') };
  }
  const frases = []; const resto = t.replace(/"([^"]+)"/g, (m, f) => { frases.push(f.trim()); return ' '; });
  return { tipo: 'texto', frases, palavras: resto.split(/\s+/).filter((w) => w.length > 1) };
}
async function buscar(q, escopo) {
  q = q.trim(); if (!q) return;
  const c = interpretarConsulta(q);
  const emLei = escopo !== 'todas' && atual && atual !== 'sobre';
  const alvoLeis = emLei ? [atual] : leis.map((l) => l.id);
  $('#conteudo').innerHTML = '<div class="carregando">Buscando…</div>';
  const res = [];
  for (const id of alvoLeis) {
    let d; try { d = await abrirLei(id); } catch (e) { continue; }
    d.unidades.forEach((u) => {
      if (c.tipo === 'artigo') { const ehTema = /^(Tema|IRDR|IAC) /.test(u.head); if ((c.so === 'tema' && !ehTema) || (c.so === 'art' && ehTema)) return; if (u.chave === c.chave) res.push({ id, u, score: 100 }); return; }
      const termos = [...c.frases, ...c.palavras];
      const noTexto = termos.every((t) => u.busca.includes(t));
      const naAnalise = !noTexto && termos.every((t) => u.busca.includes(t) || u.buscaAn.includes(t));
      if (noTexto || naAnalise) res.push({ id, u, score: (noTexto ? 10 : 1) + termos.reduce((s, t) => s + (u.busca.split(t).length - 1), 0) });
    });
  }
  if (c.tipo === 'artigo' && res.length === 1) { location.hash = `#/${res[0].id}/${res[0].u.id}`; return; }
  res.sort((a, b) => b.score - a.score);
  const termos = c.tipo === 'texto' ? [...c.frases, ...c.palavras] : [];
  const onde = alvoLeis.length > 1 ? 'em todas as leis' : 'em ' + leis.find((l) => l.id === alvoLeis[0]).nome;
  let h = `<div class="cabecalho-corrido">Lex Vade Mecum · Busca</div><h1 class="titulo-obra">${res.length} resultado${res.length === 1 ? '' : 's'}</h1>
    <p class="subtitulo">para “${esc(q)}” ${esc(onde)}</p><div class="vinheta">❦</div>`;
  res.slice(0, 300).forEach(({ id, u }) => {
    const lei = leis.find((l) => l.id === id);
    h += `<a class="res" href="#/${id}/${u.id}${termos.length ? '?q=' + encodeURIComponent(termos.join('|')) : ''}"><div class="t">${esc(u.head)}</div><div class="l">${esc(lei.nome)}${u.loc ? ' · ' + esc(u.loc) : ''}</div><div class="s">${trecho(u, termos)}</div></a>`;
  });
  if (res.length > 300) h += `<p class="dica">Mostrando os 300 primeiros. Refine a busca para ver outros.</p>`;
  if (!res.length) h += `<div class="dica">Nada encontrado. Tente outras palavras${emLei ? ' ou busque <b>em todas</b> as leis' : ''}.</div>`;
  $('#conteudo').innerHTML = h + rodape();
  $('#main').scrollTop = 0;
}
function trecho(u, termos) {
  const plano = u.texto.join(' ').replace(/~~/g, '').replace(/\\/g, '').replace(/\*\*/g, '');
  if (!termos.length) return esc(plano.slice(0, 220)) + (plano.length > 220 ? '…' : '');
  const base = semAcento(plano); let k = -1;
  for (const t of termos) { k = base.indexOf(t); if (k >= 0) break; }
  if (k < 0) {
    const a = u.analise.replace(/[#*>]/g, '').replace(/\s+/g, ' '); const b = semAcento(a);
    for (const t of termos) { k = b.indexOf(t); if (k >= 0) return '<i>Na análise:</i> …' + realcar(esc(a.slice(Math.max(0, k - 80), k + 160)), termos) + '…'; }
    return esc(plano.slice(0, 200));
  }
  const ini = Math.max(0, k - 90);
  return (ini ? '…' : '') + realcar(esc(plano.slice(ini, ini + 260)), termos) + (ini + 260 < plano.length ? '…' : '');
}

/* ---------- Rotas ---------- */
async function rota() {
  const [cam, qs = ''] = location.hash.replace(/^#\/?/, '').split('?');
  const [id, alvo] = cam.split('/');
  const termos = (new URLSearchParams(qs).get('q') || '').split('|').filter(Boolean);
  if (!id) return inicio();
  if (id === 'sobre') return sobre();
  if (atual === id && $('#conteudo .titulo-obra') && !termos.length) { desenharMenu(); return irPara(id, alvo); }
  await mostrarLei(id, alvo, termos);
}
function fecharMenu() { document.body.classList.remove('menu-aberto'); }

(async function () {
  try { const t = localStorage.getItem('lex-tema'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  $('#temaBtn').onclick = () => {
    const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    const novo = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = novo; try { localStorage.setItem('lex-tema', novo); } catch (e) {}
  };
  $('#menuBtn').onclick = () => document.body.classList.toggle('menu-aberto');
  ligarAcoes();
  $('#topoBtn').onclick = () => ($('#main').scrollTop = 0);
  $('#sobreBtn').onclick = () => { location.hash = '#/sobre'; fecharMenu(); };
  $('#formBusca').onsubmit = (e) => { e.preventDefault(); fecharMenu(); buscar($('#q').value, $('#escopo').value); };
  try { await carregarCatalogo(); } catch (e) { return erro(e); }
  if (!leis.length) return erro(new Error('Nenhuma lei encontrada no README.'));
  window.addEventListener('hashchange', rota);
  rota();
})();
